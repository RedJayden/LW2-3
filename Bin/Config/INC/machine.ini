; =========================================================================
; [MACHINE] - 하드웨어 드라이버 벤더 정의 및 기본 구동 환경 설정
; =========================================================================
[MACHINE]
; 스캐너 종류 (SinoGalvo, Scanlab, Thorlabs)
SCANNER=SinoGalvo
; 모션 컨트롤러 종류 (PMAC, Fastech)
MOTION=PMAC
; 조명 컨트롤러 종류 (LFINE, BitBus, None)
LIGHT=LFINE
; 레이저 소스 종류 (JPT, Aurelia, None)
LASER=Aurelia

; 개별 하드웨어 모듈 소프트웨어 로드 여부 (0: 비활성, 1: 활성)
; 스캐너 라이브러리(JhcLib 등) 초기화 및 통신 사용 여부
USE_SCANNER=1
; 모션 컨트롤러 포트 연결 및 서보 전원 제어 사용 여부
USE_MOTION=1
; 조명 컨트롤러 시리얼 통신 개방 및 상태 폴링 사용 여부
USE_LIGHT=1
; 레이저 하드웨어 포트 연결 및 전원/파라미터 제어 사용 여부
USE_LASER=1

; 수동(JOG) 구동 방향 설정 (0: 정상 방향, 1: 반전 방향)
; 본 장비는 Y축 상향이 +, X축 우향이 + 극성을 가집니다.
; X축 JOG 이동 시 방향성 반전 여부
JOG_X_DIR=1
; Y축 JOG 이동 시 방향성 반전 여부
JOG_Y_DIR=1

; PC 그래픽스(GPU) 하드웨어 성능 등급 (LOW, HIGH)
; - HIGH(기본값): D3D11 하드웨어 가속을 사용해 캔버스/카메라 렌더링을 최고 성능으로 구동.
; - LOW: 오래되었거나 저사양인 내장 그래픽(iGPU) 장비 PC 전용 안전 모드.
;   D3D11 하드웨어 가속 대신 SwiftShader 소프트웨어 렌더링으로 전환하여, 저사양 GPU/드라이버
;   조합에서 드물게 발생하는 CEF 렌더러 크래시("Aw, Snap!", STATUS_BREAKPOINT)를 회피한다.
;   화면이 다소 무거워질 수 있으나 안정성을 우선한다. 저사양 PC에서 위 크래시가 반복되면 LOW로 설정할 것.
;   (근거: docs/checkpoints/CEF_TextSelect_Crash_Analysis.md)
GPU_TIER=LOW

; UI 및 작업 환경 부가 설정
; UI상에서 CAD/Recipe 캔버스 기능 사용 여부 (0: 숨김, 1: 표시)
USE_CANVAS=0
; GCode 및 명령 프리뷰 상세창 사용 여부 (0: 숨김, 1: 표시)
USE_PROCESS_DETAIL=1
; 실행 취소(Undo) / 다시 실행(Redo) 최대 이력 저장 단계 수
MAX_HISTORY_STEPS=100

; 스테이지 축별 물리 구동 한계 영역 설정 (소프트웨어 인터락 한계값, 단위: mm)
; X축 구동 범위 최소값 (이하로 구동 시 이동 제한 및 인터락)
STAGE_MIN_X=-100
; X축 구동 범위 최대값 (이상으로 구동 시 이동 제한 및 인터락)
STAGE_MAX_X=100
; Y축 구동 범위 최소값 (이하로 구동 시 이동 제한 및 인터락)
STAGE_MIN_Y=-100
; Y축 구동 범위 최대값 (이상으로 구동 시 이동 제한 및 인터락)
STAGE_MAX_Y=100


; =========================================================================
; [SUPPORTED_FEATURES] - 장비 사양별 세부 기능 지원 여부 및 정밀도 배율 설정
; =========================================================================
[SUPPORTED_FEATURES]
; 소프트웨어 제어 허용 모드 구성 (콤마 단위 다중 입력 가능)
; SCANNER: 스캐너 기본 마킹 구동 활성화
; OBJECT: 대물렌즈(카메라) 얼라인 및 배율 구동 활성화
; SCANNER인 경우 스캐너만 사용, OBJECT인 경우 오브젝트만 사용, SCANNER,OBJECT 둘다 사용
ALLOWED_MODES=SCANNER,OBJECT

; 본 장비 기종에 장착된 물리 렌즈 배율 사양 구성 (콤마 단위 다중 입력 가능)
ALLOWED_LENSES=X20,X50

; 조명 장치 물리 출력 채널 구성 수 (0 ~ 6)
LIGHT_CHANNELS=5

; 모션 제어 시스템 단위 정밀도 환산 배율 (Pulse/Micron 배율 보정)
; - PMAC 시스템: mm 값을 마이크론/펄스로 연산하기 위해 1000.0 배율 사용
; - Fastech 시스템: 드라이버 레벨에서 mm 단위를 직접 수용하므로 1.0 배율 사용
UNIT_MULTIPLIER=1000.0
;UNIT_MULTIPLIER=1.0

; 보조 축 모션 장치 탑재 여부 (0: 없음/사용안함, 1: 장착/사용)
; 배율 스위칭용 대물렌즈(Moons) 모션 모터 장착 여부
HAS_LENS_MOTOR=1
; 제로지(ZeroG) 방진/자이로 높이 복원 제어 모듈 장착 여부
HAS_ZEROG=0